# CrowdFlow DNA - Global Configuration

pipeline:
  # Process every Nth frame (trades off latency vs temporal resolution)
  frame_sample_rate: 3  
  # Timeout in seconds to abort processing (Hugging Face CPU limits)
  timeout_seconds: 180  

detection:
  model_weights: "yolov8n.pt"
  confidence_threshold: 0.35
  classes: [0] # 0 = 'person' in COCO dataset

tracking:
  # ByteTrack parameters
  track_thresh: 0.4
  track_buffer: 30
  match_thresh: 0.8

graph:
  # Maximum Euclidean distance (in metres) to create an edge
  proximity_radius: 2.0

model:
  # GNN + GRU architecture hyperparameters
  gnn_hidden_dim: 64
  gru_hidden_dim: 64
  gru_num_layers: 2
  gru_dropout: 0.0
  gru_bidirectional: false
  num_gnn_layers: 2
  classes: ["Safe", "Congesting", "Critical"]
  onnx_path: "assets/model.onnx"

rendering:
  # Colorblind-considerate colors for risk levels (BGR format for OpenCV)
  colors:
    Safe: [0, 255, 0]          # Green
    Congesting: [0, 165, 255]  # Orange
    Critical: [0, 0, 255]      # Red
  bbox_thickness: 2
  edge_thickness: 1

simulation:
  # Number of simulation runs per scenario (Safe / Congesting / Critical).
  # Total files = num_runs_per_scenario × 3.
  num_runs_per_scenario: 100

  # Number of PySocialForce timesteps per run.
  num_timesteps: 300

  # Base random seed. Run i of scenario S gets seed = random_seed_base + offset.
  # Keeping this fixed makes the entire dataset fully reproducible.
  random_seed_base: 0

  # Directory where JSON trajectory files and manifest.json are written.
  # Relative paths are resolved from the repository root.
  output_dir: "data/synthetic"

training:
  batch_size: 4
  learning_rate: 0.001
  weight_decay: 0.0001
  num_epochs: 50
  patience: 10
  scheduler_patience: 5
  scheduler_factor: 0.5
  checkpoint_dir: "checkpoints"
  random_seed: 42
  deterministic: true
  validation_split: 0.2
