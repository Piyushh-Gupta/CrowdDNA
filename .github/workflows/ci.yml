name: CI Smoke Test

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        # requirements-ci.txt is a lightweight subset of requirements.txt.
        # Heavy training-only packages (torch, torch-geometric, ultralytics,
        # gradio) are excluded to keep CI fast. They will be added to this
        # file as the corresponding modules are implemented and merged.
        pip install -r requirements-ci.txt

    - name: Lint with Ruff
      run: |
        # Check all python files in the repository
        ruff check crowdflow_dna/ tests/ training/

    - name: Run Pytest
      run: |
        # Run pytest. A placeholder test ensures this doesn't fail with exit code 5 (no tests found)
        pytest tests/
