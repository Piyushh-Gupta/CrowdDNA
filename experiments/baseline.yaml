simulation:
  output_dir: "data/simulated"

model:
  gnn_hidden_dim: 128
  gru_hidden_dim: 64
  gru_num_layers: 2
  gru_dropout: 0.1
  gru_bidirectional: true
  num_gnn_layers: 2
  classes:
    - Safe
    - Congesting
    - Critical

training:
  batch_size: 16
  num_epochs: 50
  learning_rate: 0.001
  validation_split: 0.2
  checkpoint_dir: "checkpoints"
  random_seed: 42
  deterministic: true
